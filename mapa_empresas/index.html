<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DENUE - Empresas en Yucatán</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif}
#map{background:#eef2f4}
.panel{position:absolute;z-index:1000;top:12px;right:12px;width:min(340px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:rgba(255,255,255,.96);border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.22);padding:12px 14px;box-sizing:border-box}
.panel h1{font-size:18px;margin:0 0 4px;color:#333}
.panel .sub{font-size:12px;color:#666;margin-bottom:10px}
.panel details{border-top:1px solid #e5e5e5;padding:8px 0}
.panel summary{cursor:pointer;font-weight:700;font-size:13px}
.row{display:flex;align-items:flex-start;gap:8px;margin:5px 0;font-size:12px;line-height:1.25}
.swatch{width:12px;height:12px;border-radius:50%;margin-top:1px;flex:0 0 12px;border:1px solid rgba(0,0,0,.18)}
.region-swatch{border-radius:2px}
.count{margin-left:auto;color:#777}
.leaflet-popup-content{margin:10px 12px;min-width:220px}
.popup-title{font-weight:700;font-size:14px;margin-bottom:6px;color:#222}
.popup-grid{font-size:12px;line-height:1.45}
.popup-grid b{color:#555}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;color:#fff;font-size:11px;margin-top:5px}
.home{position:absolute;z-index:1000;left:12px;top:12px;background:#fff;color:#333;text-decoration:none;border-radius:8px;padding:8px 11px;box-shadow:0 1px 8px rgba(0,0,0,.22);font-size:13px}
@media(max-width:700px){.panel{top:auto;bottom:12px;max-height:42vh}.home{top:10px}}
</style>
</head>
<body>
<a class="home" href="../">← Mapas</a>
<div id="map"></div>
<div class="panel" id="panel">
  <h1>DENUE - Empresas en Yucatán</h1>
  <div class="sub">DENUE · 603 establecimientos · mapa interactivo</div>
  <details open><summary>Regiones</summary><div id="regionList"></div></details>
  <details open><summary>Sectores</summary><div id="sectorList"></div></details>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="reg_1.js"></script><script src="reg_2.js"></script><script src="reg_3.js"></script><script src="emp_1.js"></script><script src="emp_2.js"></script><script src="emp_3.js"></script><script src="emp_4.js"></script><script src="emp_5.js"></script><script src="emp_6.js"></script><script src="config.js"></script>
<script>
const map=L.map('map',{zoomControl:true}).setView([20.75,-89.15],8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function ungzipJSON(b64){const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(stream).text());}
Promise.all([ungzipJSON(DATA_REGIONES),ungzipJSON(DATA_EMPRESAS),ungzipJSON(DATA_CONFIG)]).then(([regiones,empresas,cfg])=>{
  const regionGroups={};
  for(const f of regiones.features){
    const name=String(f.properties.nom_reg??'Región');
    (regionGroups[name]??=[]).push(f);
  }

  // Las siete regiones corresponden a las capas originales del proyecto QGIS.
  const regionOrder=[
    'Región I Poniente',
    'Región II Noroeste',
    'Región III Centro',
    'Región IV Litoral Centro',
    'Región V Noreste',
    'Región VI Oriente',
    'Región VII Sur'
  ];

  const regionLayers={};
  const regionList=document.getElementById('regionList');

  regionOrder.forEach(name=>{
    const features=regionGroups[name]||[];
    if(!features.length)return;
    const color=features[0]?.properties?.color||'#666';

    const lyr=L.geoJSON({type:'FeatureCollection',features},{
      style:{color:color,weight:2.2,fillColor:color,fillOpacity:.09},
      onEachFeature:(f,l)=>l.bindTooltip(name,{sticky:true})
    }).addTo(map);

    regionLayers[name]=lyr;

    const label=document.createElement('label');
    label.className='row';
    label.innerHTML=`<input type="checkbox" checked data-region="${esc(name)}"><span class="swatch region-swatch" style="background:${color}"></span><span>${esc(name)}</span>`;
    regionList.appendChild(label);
  });

  regionList.addEventListener('change',e=>{
    const name=e.target.dataset.region;
    if(!name)return;
    const lyr=regionLayers[name];
    if(!lyr)return;
    e.target.checked?lyr.addTo(map):map.removeLayer(lyr);
  });

  const grouped={}, counts={};
  for(const f of empresas.features){ const s=String(f.properties.sector??''); (grouped[s]??=[]).push(f); counts[s]=(counts[s]||0)+1; }
  const sectorLayers={};
  const list=document.getElementById('sectorList');
  Object.keys(grouped).sort((a,b)=>Number(a)-Number(b)).forEach(sec=>{
    const color=cfg.sector_colors[sec]||'#555';
    const lyr=L.geoJSON({type:'FeatureCollection',features:grouped[sec]},{
      pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:5,fillColor:color,color:'#333',weight:.35,fillOpacity:.9}),
      onEachFeature:(f,l)=>{ const p=f.properties; l.bindPopup(`<div class="popup-title">${esc(p.nom_estab)}</div><div class="popup-grid"><b>Actividad:</b> ${esc(p.nombre_act)}<br><b>Personal ocupado:</b> ${esc(p.per_ocu)}<br><b>Municipio:</b> ${esc(p.municipio)}<br><b>Localidad:</b> ${esc(p.localidad)}<br><b>Sector:</b> ${esc(p.sector)}<br><b>Región:</b> ${esc(p.region)}<br><span class="badge" style="background:${color}">Sector ${esc(sec)}</span></div>`); }
    }).addTo(map);
    sectorLayers[sec]=lyr;
    const label=document.createElement('label'); label.className='row';
    label.innerHTML=`<input type="checkbox" checked data-sector="${esc(sec)}"><span class="swatch" style="background:${color}"></span><span><b>${esc(sec)}</b> · ${esc(cfg.sector_names[sec]||'Sector')}</span><span class="count">${counts[sec]}</span>`;
    list.appendChild(label);
  });
  list.addEventListener('change',e=>{if(!e.target.dataset.sector)return; const lyr=sectorLayers[e.target.dataset.sector]; e.target.checked?lyr.addTo(map):map.removeLayer(lyr);});
  const bounds=L.geoJSON(regiones).getBounds(); if(bounds.isValid()) map.fitBounds(bounds.pad(.03));
}).catch(err=>{console.error(err);document.getElementById('panel').insertAdjacentHTML('beforeend','<p style="color:#b00020;font-size:12px">No se pudieron cargar las capas.</p>')});
</script>
</body></html>
